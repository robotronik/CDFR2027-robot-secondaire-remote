<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>teleop</title>
<style>
body{margin:0;padding:12px;font-family:sans-serif;text-align:center;touch-action:manipulation}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:12px auto}
button{font-size:2.5rem;min-height:96px;border:2px solid #333;border-radius:12px;background:#eee;touch-action:manipulation}
#F{grid-column:2}#L{grid-column:1;grid-row:2}#R{grid-column:3;grid-row:2}#B{grid-column:2;grid-row:3}
#S{grid-column:1/4;grid-row:4;background:#d00;color:#fff;border-color:#900;font-weight:bold}
</style></head><body>
<div id="st" role="status">Disconnected — reload</div>
<div class="pad">
<button id="F" aria-label="Forward 100 mm">▲</button>
<button id="L" aria-label="Turn left 15 degrees">◀</button>
<button id="R" aria-label="Turn right 15 degrees">▶</button>
<button id="B" aria-label="Backward 100 mm">▼</button>
<button id="S" aria-label="Stop">STOP</button>
</div>
<script>
const ws = new WebSocket('ws://' + location.host + '/ws');
const st = document.getElementById('st');
const send = c => { if (ws.readyState === 1) ws.send(c); };
ws.onopen = () => { st.textContent = 'Connected'; };
ws.onclose = () => { st.textContent = 'Disconnected — reload'; };
for (const b of document.querySelectorAll('button')) b.onclick = () => send(b.id);
setInterval(() => send('P'), 100);
</script></body></html>
